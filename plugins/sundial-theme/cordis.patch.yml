# Bundle patch for the sundial-theme plugin: one insert row.
#
# The host half serves two things the browser half needs — the bundled Inter
# Tight face and today's dial figure — so it injects `webServer`. The theme and
# the dial component themselves live entirely in the client half.
- insert:
    - id: sundial-theme
      name: '@sundial/dsh-theme'

# dsh-base's thread namer, with room to think. It allowed 64 output tokens,
# and the reasoning model the chat runs on spends those thinking: every
# title call "succeeded" with empty text (76 calls, 64 tokens each, no name),
# so every thread kept the first-words fallback. A patch row replaces the
# whole config, so every field is restated.
- id: session-title-llm
  config:
    targetWords: 5
    targetCjkCharacters: 10
    maxInputBytes: 4096
    maxOutputTokens: 2048
    timeoutMs: 60000
