# Typecheck, tests, a secret scan, and the end-to-end install on a clean macOS runner.
# Not enabled on any remote yet — this file only takes effect once pushed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: npx tsc -b tsconfig.json
      - name: Tests
        run: npx vitest run

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (tree and full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --log-opts="--all" --redact -v
          ./gitleaks detect --source . --no-git --redact -v

  e2e-install:
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install → first run → uninstall (no launchd, no permission prompts)
        run: E2E_NO_LAUNCHD=1 zsh test/e2e-install.sh
