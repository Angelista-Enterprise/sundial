name: Bug
description: Something does not work as described
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: status
    attributes:
      label: Output of `node bin/sundial status` and `node bin/sundial doctor`
      description: Check it for anything private before you paste it.
      render: text
  - type: input
    id: version
    attributes:
      label: Version (`git rev-parse --short HEAD`) and macOS version
