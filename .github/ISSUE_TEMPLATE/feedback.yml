name: Feedback
description: Something you noticed on the website or in the demo
labels: [feedback]
body:
  - type: textarea
    id: what
    attributes:
      label: What did you see, and what did you expect?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where (a page, a card, a question you asked)
  - type: input
    id: browser
    attributes:
      label: Browser and version
